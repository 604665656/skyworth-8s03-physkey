# 投影仪遥控器 -> Android 键值
# 格式: <getevent 显示的键名> <Android keycode>
# 改完不用重启守护, 下一次按键就生效
#
# Android keycode 常用值:
#   4  返回      3  主页      19 上      20 下     21 左     22 右
#   23 OK/确认   24 音量+    25 音量-   26 电源   66 OK(Enter)
#   85 播放暂停  87 下一曲    88 上一曲

# ── 已实测确认 ──────────────────────────────
KEY_FN_ESC    24     # 音量+
KEY_FN_F12    25     # 音量-
KEY_3         19     # 方向上
KEY_2         20     # 方向下
KEY_7         23     # OK / 确认
KEY_NEXTSONG  21     # 方向左 (待验证)
KEY_CHANNELDOWN 22   # 方向右 (待验证)
KEY_1         3      # 主页   (待验证)

# ── 已停用: 返回 ────────────────────────────
# 这台电视的 tvos 播放器在 ATV 主界面被返回键结束时, Surface 会悬空,
# 接手的桌面在 surfaceCreated 里抛 IllegalArgumentException 连锁崩溃。
# 实测: 20:47:11 注入 BACK -> 20:47:14 FATAL EXCEPTION -> 桌面也崩。
# 焦点判断挡不住(主界面被其他窗口盖住时 mFocusedApp 查不到 RootActivity)。
# 确认要重新启用, 把下面这行前面的 # 去掉, 并接受偶发界面重启。
#KEY_FAVORITES  4     # 返回

# ── 待验证（按按键节奏推断，未逐键标注） ──────
# 投影仪遥控器实际出现的 9 个码: 0x01 0x02 0x03 0x07 0x0f 0x13 0x48 0x5c 0x9b
# 已确认 6 个，剩下三个按下面这样对:
#   KEY_NEXTSONG    0x48  长按时连续触发最频繁 -> 判为方向键
#   KEY_CHANNELDOWN 0x13  -> 判为另一侧方向键
#   KEY_1           0x01  干净点按 -> 判为主页
# 如果左右反了，把 21 和 22 对调即可；如果主页错位，改对应行的键值。
#
# 不知道某个键叫什么: 按一下，去 /data/local/tmp/ir_unknown.log 看。
